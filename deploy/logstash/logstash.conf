# Nhan event tu Filebeat (ca 3 VM) qua giao thuc beats, chuyen thang vao
# Elasticsearch. Khong filter gi them - Filebeat da parse JSON (json.keys_under_root)
# truoc khi gui, Logstash chi dong vai trung chuyen dung chuan ELK.
input {
  beats {
    port => 5044
  }
}

# Moi loai log 1 data stream rieng: library-logs-<kind>-YYYY.MM.dd. Van khop
# pattern library-logs-* nen template retention, data view va detection rules
# khong phai doi. Chi them [@metadata][kind] (khong vao document).
filter {
  if [log_source] == "suricata_ids" {
    mutate { add_field => { "[@metadata][kind]" => "suricata" } }
    mutate { copy => { "[suricata][src_ip]" => "ip" } }
    if [suricata][http][url] { mutate { copy => { "[suricata][http][url]" => "uri" } } }
  } else if [log_source] == "host_auth" {
    mutate { add_field => { "[@metadata][kind]" => "host-auth" } }
    # sshd: "Failed password for [invalid user] X from 1.2.3.4 port 22 ssh2".
    # Dong khong khop (sudo, cron...) giu nguyen o message, khong gan tag loi.
    grok {
      match => { "message" => "(?<ssh_result>Failed|Accepted) (?<ssh_method>\S+) for (invalid user )?(?<target_user>\S+) from %{IP:src_ip} port %{INT:src_port}" }
      tag_on_failure => []
    }
    # sudo/su (chi chay khi khong phai dong ssh). priv_user = nguoi thuc hien,
    # priv_target = tai khoan dich. Co "user NOT in sudoers"/"incorrect password"
    # truoc TTY= (priv_note) hoac "FAILED su" => failure.
    if ![ssh_result] {
      grok {
        match => { "message" => [
          "sudo(\[\d+\])?: +%{NOTSPACE:priv_user} : (?<priv_note>[^;]+; )?TTY=%{NOTSPACE} ; PWD=%{NOTSPACE} ; USER=%{NOTSPACE:priv_target} ; COMMAND=%{GREEDYDATA:priv_command}",
          "su(\[\d+\])?: (?<priv_status>Successful|FAILED) su for %{NOTSPACE:priv_target} by %{NOTSPACE:priv_user}"
        ] }
        tag_on_failure => []
      }
      if [priv_user] {
        if [message] =~ /sudo/ {
          mutate { add_field => { "priv_tool" => "sudo" } }
        } else {
          mutate { add_field => { "priv_tool" => "su" } }
        }
        if [priv_note] or [priv_status] == "FAILED" {
          mutate { add_field => { "priv_result" => "failure" } }
        } else {
          mutate { add_field => { "priv_result" => "success" } }
        }
        mutate { remove_field => ["priv_status"] }
      }
    }
  } else if [log_source] == "host_audit" {
    mutate { add_field => { "[@metadata][kind]" => "host-audit" } }
    # auditd: type=SYSCALL ... exe="/usr/bin/touch" key="lib_audit". Chi lay vai
    # key huu ich, prefix audit_ de khong dung ten field ECS.
    kv {
      source => "message"
      include_keys => ["type", "key", "exe", "comm", "auid", "uid", "success"]
      prefix => "audit_"
      trim_value => "\""
    }
  } else if [app] == "nginx" {
    mutate { add_field => { "[@metadata][kind]" => "nginx" } }
  } else if [app] == "backend" {
    if [event][category] == "authentication" {
      mutate { add_field => { "[@metadata][kind]" => "backend-auth" } }
    } else if [event][category] == "database" {
      mutate { add_field => { "[@metadata][kind]" => "backend-audit" } }
    } else if [event][category] == "web" {
      mutate { add_field => { "[@metadata][kind]" => "backend-access" } }
    } else {
      mutate { add_field => { "[@metadata][kind]" => "backend-other" } }
    }
  } else if [container][name] =~ /pgpool/ {
    mutate { add_field => { "[@metadata][kind]" => "pgpool" } }
  } else if [container][name] =~ /library_pg(0|1)/ and [message] =~ /AUDIT:/ {
    mutate { add_field => { "[@metadata][kind]" => "postgres-audit" } }
    # AUDIT: SESSION,1,1,DDL,CREATE TABLE,TABLE,public.t,"<statement>",...
    # Cố ý KHONG tach statement (co the chua gia tri nhay cam, vd PASSWORD).
    grok {
      match => { "message" => "AUDIT: %{WORD:audit_type},%{INT},%{INT},(?<audit_class>[A-Z]+),(?<audit_command>[^,]+),(?<audit_object_type>[^,]*),(?<audit_object>[^,]*)," }
      tag_on_failure => []
    }
  } else if [container][name] =~ /library_pg(0|1|_witness)/ {
    mutate { add_field => { "[@metadata][kind]" => "postgres" } }
  } else {
    mutate { add_field => { "[@metadata][kind]" => "other" } }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    index => "library-logs-%{[@metadata][kind]}-%{+YYYY.MM.dd}"
    # create, not index: library-logs-* matches a data-stream index template
    # (left over from when Filebeat wrote to ES directly), and data streams
    # reject the default "index" op ("only write ops with an op_type of create
    # are allowed in data streams").
    action => "create"
    # false: de Elasticsearch tu suy luan mapping tu chinh du lieu cua app
    # (dynamic mapping) thay vi template mac dinh cua Logstash/Beats - tranh
    # lap lai loi xung dot kieu voi ECS da gap truoc do (xem deploy/LOGGING.md).
    manage_template => false
  }
}
