# Nhan event tu Filebeat (ca 3 VM) qua giao thuc beats, chuyen thang vao
# Elasticsearch. Khong filter gi them - Filebeat da parse JSON (json.keys_under_root)
# truoc khi gui, Logstash chi dong vai trung chuyen dung chuan ELK.
input {
  beats {
    port => 5044
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    index => "library-logs-%{+YYYY.MM.dd}"
    # create, not index: library-logs-* matches a data-stream index template
    # (left over from when Filebeat wrote to ES directly), and data streams
    # reject the default "index" op ("only write ops with an op_type of create
    # are allowed in data streams").
    action => "create"
    # false: de Elasticsearch tu suy luan mapping tu chinh du lieu cua app
    # (dynamic mapping) thay vi template mac dinh cua Logstash/Beats - tranh
    # lap lai loi xung dot kieu voi ECS da gap truoc do (xem deploy/LOGGING.md).
    manage_template => false
  }
}
