
filebeat.autodiscover:
  providers:
    - type: docker
      templates:
        - condition:
            and:
              - contains:
                  docker.container.name: "library_"
              - not:                                                                                              
                  or:
                    - contains:
                        docker.container.name: "filebeat"
                    - contains:
                        docker.container.name: "logstash"
          config:
            - type: container
              paths:
                - /var/lib/docker/containers/${data.docker.container.id}/*.log
              json.keys_under_root: true
              json.add_error_key: true

filebeat.inputs:
  - type: filestream
    id: host-auth
    paths: ["/host/var/log/auth.log", "/host/var/log/secure"]
    fields_under_root: true
    fields: {log_source: host_auth}
  - type: filestream
    id: host-audit
    paths: ["/host/var/log/audit/audit.log"]
    fields_under_root: true
    fields: {log_source: host_audit}
  - type: filestream
    id: suricata-eve
    paths: ["/var/log/suricata/eve.json"]
    parsers:
      - ndjson:
          target: "suricata"
          add_error_key: true
    fields_under_root: true
    fields: {log_source: suricata_ids}
    processors:
      - drop_event:
          when.not.equals:
            suricata.event_type: alert

processors:
  - add_host_metadata: ~
  - add_docker_metadata: ~

output.logstash:
  # VM2/VM3 set LOGSTASH_HOST=${VM1_IP}:5044; VM1 defaults to the compose service.
  hosts: ["${LOGSTASH_HOST:logstash:5044}"]
