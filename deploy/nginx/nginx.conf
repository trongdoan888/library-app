events {
    worker_connections 1024;
}

http {
    # Cung dang JSON nhu moi log khac trong he thong (xem deploy/LOGGING.md) -
    # Filebeat parse thang field nay, khong can grok pattern rieng.
    # duration_s la giay (so thap phan), khong phai ms - nginx stock khong co
    # bien duration_ms san, bia so la sai, nen ghi dung don vi that co.
    log_format access_json escape=json
        '{"@timestamp":"$time_iso8601",'
        '"level":"INFO",'
        '"app":"nginx",'
        '"event":{"category":"web","action":"http_request","outcome":"$outcome"},'
        '"method":"$request_method",'
        '"endpoint":"$uri",'
        '"status":$status,'
        '"duration_s":$request_time,'
        '"ip":"$remote_addr"}';

    map $status $outcome {
        default "success";
        "~^[45]" "failure";
    }

    server {
        listen 80;

        access_log /dev/stdout access_json;
        error_log /dev/stderr warn;

        # Django: API + admin + static. Phai dung "/api/" khong phai "/" vi
        # toan bo endpoint cua api/urls.py deu nam duoi prefix nay.
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /admin/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /static/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
        }

        # Moi thu con lai: Next.js frontend.
        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
