# Chạy TRÊN VM2:  docker compose -f compose.vm2.yml up -d
#
# VM2 chỉ chạy node standby pg-1. repmgr sẽ tự clone dữ liệu từ pg-0
# (REPMGR_PRIMARY_HOST = ${VM1_IP}) qua cổng 5432 mà VM1 publish, rồi vào
# chế độ streaming standby. Khi pg-0 chết, repmgr trên pg-1 tự promote pg-1
# lên primary.
#
# .env trên VM2 phải giống hệt .env trên VM1 (cùng mật khẩu, cùng VM1_IP/VM2_IP).

services:
  pg-1:
    image: bitnamilegacy/postgresql-repmgr:16.6.0
    container_name: library_pg1
    env_file:
      - .env
    environment:
      POSTGRESQL_POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRESQL_USERNAME: ${POSTGRES_USER}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRESQL_DATABASE: ${POSTGRES_DB}
      REPMGR_PASSWORD: ${REPMGR_PASSWORD}
      REPMGR_PRIMARY_HOST: ${VM1_IP}
      REPMGR_PARTNER_NODES: ${VM1_IP},${VM2_IP}
      REPMGR_NODE_NAME: pg-1
      REPMGR_NODE_NETWORK_NAME: ${VM2_IP}
      REPMGR_PORT_NUMBER: 5432
    ports:
      - "5432:5432"
    volumes:
      - pg_1_data:/bitnami/postgresql
    restart: always

volumes:
  pg_1_data:
