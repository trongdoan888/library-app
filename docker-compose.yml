# VM1 (${VM1_IP}) — app + pgpool + witness + backup.
#   docker compose up -d
#
# HA DB tách 3 máy:
#   VM2 ${VM2_IP}  -> pg-0   (docker-compose.pg0.yml)
#   VM3 ${VM3_IP}  -> pg-1   (docker-compose.pg1.yml)
#   VM1 ${VM1_IP}  -> pg-witness (quorum, KHÔNG giữ dữ liệu) + pgpool + backend/frontend
# Các node repmgr (pg-0/pg-1/pg-witness) chạy network_mode: host — nối nhau
# qua IP tĩnh + cổng 5432 thật của mỗi VM, không qua NAT publish của Docker
# (tránh lỗi hairpin khi 1 node tự kết nối tới chính IP của nó).
services:

  # --- repmgr witness: chỉ bỏ phiếu khi failover, không chứa dữ liệu ứng dụng ---
  # network_mode: host — tránh NAT-hairpin khi repmgrd tự kết nối tới chính mình
  # qua REPMGR_NODE_NETWORK_NAME=${VM1_IP} (xem docker-compose.pg0.yml). Vì vậy
  # nó chiếm luôn cổng 5432 thật của VM1 — không cần "ports:" nữa.
  pg-witness:
    image: bitnamilegacy/postgresql-repmgr:16.6.0
    container_name: library_pg_witness
    network_mode: host
    env_file:
      - .env
    environment:
      POSTGRESQL_POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRESQL_USERNAME: ${POSTGRES_USER}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRESQL_DATABASE: ${POSTGRES_DB}
      REPMGR_PASSWORD: ${REPMGR_PASSWORD}
      REPMGR_NODE_ID: "3"
      REPMGR_NODE_NAME: witness-3           # tên witness phải khớp mẫu <chữ>-<số>
      REPMGR_NODE_NETWORK_NAME: ${VM1_IP}
      REPMGR_PORT_NUMBER: 5432
      REPMGR_NODE_TYPE: witness
      REPMGR_PRIMARY_HOST: ${VM2_IP}
      REPMGR_PARTNER_NODES: ${VM2_IP}:5432,${VM3_IP}:5432,${VM1_IP}:5432
      REPMGR_PGHBA_TRUST_ALL: "yes"
    volumes:
      - pg_witness_data:/bitnami/postgresql
    restart: always

  # --- Connection pooler / load balancer đứng trước cụm DB (2 node ở VM2/VM3) ---
  # backend & pgAdmin chỉ nói chuyện pgpool; pgpool luôn định tuyến write tới
  # node repmgr đang coi là primary.
  pgpool:
    image: bitnamilegacy/pgpool:4.6.3
    container_name: library_pgpool
    env_file:
      - .env
    environment:
      PGPOOL_BACKEND_NODES: 0:${VM2_IP}:5432,1:${VM3_IP}:5432
      # application_name mỗi standby dùng khi stream tới primary (bitnami
      # repmgr đặt = REPMGR_NODE_NAME). auto_failback cần list này để khớp
      # node trong pg_stat_replication; phải cùng độ dài với BACKEND_NODES.
      PGPOOL_BACKEND_APPLICATION_NAMES: pg-0,pg-1
      PGPOOL_SR_CHECK_USER: postgres
      PGPOOL_SR_CHECK_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      PGPOOL_POSTGRES_USERNAME: postgres
      PGPOOL_POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      PGPOOL_ADMIN_USERNAME: admin
      PGPOOL_ADMIN_PASSWORD: ${PGPOOL_ADMIN_PASSWORD}
      PGPOOL_ENABLE_HEALTH_CHECK: "yes"
      PGPOOL_HEALTH_CHECK_PERIOD: "10"
      PGPOOL_HEALTH_CHECK_MAX_RETRIES: "3"
      PGPOOL_HEALTH_CHECK_RETRY_DELAY: "3"
      # Sau khi repmgr đã cho node cũ rejoin làm standby, pgpool tự `attach`
      # lại node đó (khi nó đang streaming từ primary) — không cần
      # `docker compose restart pgpool` / `pcp_attach_node` thủ công nữa.
      PGPOOL_AUTO_FAILBACK: "yes"
      PGPOOL_POSTGRES_CUSTOM_USERS: ${POSTGRES_USER}
      PGPOOL_POSTGRES_CUSTOM_PASSWORDS: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"          # 5432 trên VM1 đã bị pg-witness chiếm; GUI ngoài nối cổng 5433
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=${POSTGRES_PASSWORD} psql -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER} -d ${POSTGRES_DB} -tAc 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always

  pgadmin:
    image: dpage/pgadmin4:snapshot
    container_name: library_pgadmin
    restart: always
    env_file:
      - .env
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - pgpool

  # --- Backup định kỳ: mỗi 6h dump DB ra thư mục trên máy thật (Windows) ---
  # Ghi thẳng qua SMB nhờ volume `host_pg_backups` (CIFS) khai báo bên dưới.
  pg-backup:
    build:
      context: ./deploy/backup
    image: library-pg-backup:latest
    container_name: library_pg_backup
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      # pg-0 ở VM2, pg-1 ở VM3 (theo IP). Script ưu tiên dump từ primary.
      PG_NODES: "${VM2_IP}:5432 ${VM3_IP}:5432"
      BACKUP_INTERVAL: "21600"   # 6 giờ
      KEEP: "28"                 # giữ 28 bản .dump gần nhất
      TZ: "Asia/Ho_Chi_Minh"
    volumes:
      - host_pg_backups:/backups
    restart: always

  backend:
    build:
      context: ./backend_library
      dockerfile: Dockerfile
    container_name: library_backend
    env_file:
      - .env
    environment:
      # backend nối pgpool qua mạng compose (tên service), không đổi khi failover.
      POSTGRES_HOST: pgpool
      POSTGRES_PORT: 5432
    # Không publish port 8000 ra host nữa - chỉ nginx (và các container khác
    # trong mạng compose) gọi tới backend qua tên service "backend:8000".
    restart: always
    depends_on:
      pgpool:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend_library
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: library_frontend
    # Không publish port 3000 ra host nữa - chỉ nginx gọi tới qua "frontend:3000".
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - backend
    restart: always

  # Cổng vào duy nhất của cả app: /api/*, /admin/*, /static/* -> backend,
  # còn lại -> frontend. Gộp về 1 origin nên bỏ được CORS cho đường đi qua
  # đây, và frontend/backend giờ không còn lộ port trực tiếp ra ngoài.
  # Access log của nginx (JSON, có status/duration_ms thật - thứ mà middleware
  # của Next.js không có được vì nó chạy trước khi response hoàn tất) tự được
  # Filebeat thu qua autodiscover như mọi container "library_*" khác.
  nginx:
    image: nginx:1.27-alpine
    container_name: library_nginx
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    restart: always

  # --- Log pipeline: Filebeat ships every container's stdout to Elasticsearch,
  # Kibana visualizes it, Elastic Security runs detection rules on top.
  # ponytail: single ES node, no TLS between containers (internal docker
  # network only), ILM off (index grows unbounded) - fine for a homelab,
  # add ILM + TLS if this ever needs to survive an audit.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: library_elasticsearch
    env_file:
      - .env
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: always

  # One-shot: gives the built-in kibana_system user a password so Kibana can
  # authenticate. Re-running is harmless (just resets the same password).
  es-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: library_es_setup
    env_file:
      - .env
    depends_on:
      elasticsearch:
        condition: service_healthy
    entrypoint: ["bash", "-c"]
    command:
      - |
        curl -sf -u elastic:${ELASTIC_PASSWORD} -X POST \
          http://elasticsearch:9200/_security/user/kibana_system/_password \
          -H 'Content-Type: application/json' \
          -d "{\"password\":\"${KIBANA_PASSWORD}\"}" && \
        curl -sf -u elastic:${ELASTIC_PASSWORD} -X PUT \
          http://elasticsearch:9200/_ilm/policy/library-logs \
          -H 'Content-Type: application/json' \
          -d '{"policy":{"phases":{"delete":{"min_age":"30d","actions":{"delete":{}}}}}}' &&
        curl -sf -u elastic:${ELASTIC_PASSWORD} -X PUT \
          http://elasticsearch:9200/_index_template/library-logs \
          -H 'Content-Type: application/json' \
          -d '{"index_patterns":["library-logs-*"],"template":{"settings":{"index.lifecycle.name":"library-logs"}}}'
    restart: "no"

  # L trong ELK: nhan event beats tu Filebeat (ca 3 VM), chuyen toi Elasticsearch.
  # Khong filter - Filebeat da parse JSON truoc khi gui.
  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    container_name: library_logstash
    env_file:
      - .env
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
    volumes:
      - ./deploy/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    ports:
      - "5044:5044"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: always

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: library_kibana
    env_file:
      - .env
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD}
      # Bắt buộc cho Alerting/Detection Rules (Giai đoạn 7) - thiếu sẽ lỗi
      # "Encrypted Saved Objects plugin is missing encryption key".
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY}
    ports:
      - "5601:5601"
    depends_on:
      es-setup:
        condition: service_completed_successfully
    restart: always

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.3
    container_name: library_filebeat
    user: root
    # filebeat.yml is bind-mounted from the git checkout (owned by the VM's
    # login user, not root) - Beats refuses to start otherwise ("config file
    # must be owned by root"). --strict.perms=false is Elastic's documented
    # workaround for exactly this bind-mount-from-git setup.
    # -e: log to stderr (so `docker logs` actually shows something) instead
    # of the default of writing to a file inside the container.
    command: ["-e", "--strict.perms=false"]
    env_file:
      - .env
    volumes:
      - ./deploy/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/host/var/log:ro
    depends_on:
      logstash:
        condition: service_started
    restart: always

volumes:
  pg_witness_data:
  pgadmin_data:
  es_data:

  # Thư mục trên máy thật Windows, chia sẻ qua SMB.
  # Trên Windows: share thư mục C:\Users\doant\OneDrive\Documents\Desktop\pg-backups
  #   với Share name = pg-backups, cấp Change + Read cho user SMB_USERNAME.
  # WIN_HOST_IP / SMB_USERNAME / SMB_PASSWORD lấy từ .env
  host_pg_backups:
    driver: local
    driver_opts:
      type: cifs
      device: "//${WIN_HOST_IP}/pg-backups"
      o: "username=${SMB_USERNAME},password=${SMB_PASSWORD},uid=0,gid=0,vers=3.0,file_mode=0640,dir_mode=0750,noserverino"


#test