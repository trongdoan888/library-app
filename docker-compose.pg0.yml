# VM2 (${VM2_IP}) — Postgres HA node "pg-0".
#   docker compose -f docker-compose.pg0.yml up -d
#
# network_mode: host — repmgrd tự kết nối tới CHÍNH mình qua REPMGR_NODE_NETWORK_NAME
# (IP LAN của chính VM). Qua publish port bình thường, việc này là NAT-hairpin
# (container tự gọi ra ngoài rồi vòng lại chính nó) mà nhiều mạng ảo (VMware
# NAT/bridge + iptables) không xử lý được -> container crash-loop liên tục dù
# node khác nối vào vẫn bình thường. host mode bỏ hẳn NAT của Docker cho node
# này: bind thẳng vào cổng 5432 thật của VM, không cần "ports:" nữa.
services:
  pg-0:
    image: bitnamilegacy/postgresql-repmgr:16.6.0
    container_name: library_pg0
    network_mode: host
    env_file:
      - .env
    environment:
      POSTGRESQL_POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRESQL_USERNAME: ${POSTGRES_USER}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRESQL_DATABASE: ${POSTGRES_DB}
      REPMGR_PASSWORD: ${REPMGR_PASSWORD}
      REPMGR_NODE_ID: "1"
      REPMGR_NODE_NAME: pg-0
      REPMGR_NODE_NETWORK_NAME: ${VM2_IP}        # địa chỉ node khác dùng để nối tới pg-0
      REPMGR_PORT_NUMBER: 5432
      REPMGR_PRIMARY_HOST: ${VM2_IP}             # trỏ tới CHÍNH nó -> pg-0 khởi tạo làm primary
      REPMGR_PARTNER_NODES: ${VM2_IP}:5432,${VM3_IP}:5432,${VM1_IP}:5432
      REPMGR_PGHBA_TRUST_ALL: "yes"              # LAN riêng; siết lại nếu mạng không tin cậy
      # Audit DB (ai tao/sua/xoa bang, role, quyen - ke ca ket noi thang khong qua
      # app). Image bitnami co san pgaudit; log ra stdout -> Filebeat thu nhu cu.
      # Chi ddl+role (khong 'write'/'read': qua on ao va lo gia tri du lieu).
      POSTGRESQL_PGAUDIT_LOG: "ddl,role"
      POSTGRESQL_LOG_LINE_PREFIX: "%m [%p] user=%u db=%d client=%h "
    volumes:
      - pg_0_data:/bitnami/postgresql
    restart: always

  # Ship pg-0's stdout to the Logstash trên VM1 qua LAN (xem deploy/LOGGING.md).
  # Cần mở port 5044 trên ufw của VM1 cho subnet LAN, giống cách 5432 đã mở
  # (HA-3VM.md mục 0.4) - script này không tự làm việc đó.
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.3
    container_name: library_filebeat_pg0
    user: root
    # filebeat.yml bind-mount từ git checkout (owner = user VM, không phải
    # root) -> Beats chặn khởi động nếu không có cờ này (xem docker-compose.yml).
    # -e: log ra stderr thay vì ghi vào file nội bộ container (không thì
    # `docker logs` luôn trống dù filebeat lỗi hay chạy tốt).
    command: ["-e", "--strict.perms=false"]
    env_file:
      - .env
    environment:
      LOGSTASH_HOST: ${VM1_IP}:5044
    volumes:
      - ./deploy/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/host/var/log:ro
    restart: always

volumes:
  pg_0_data: